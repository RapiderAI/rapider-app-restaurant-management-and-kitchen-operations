<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Restaurant Management &amp; Kitchen Operations</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "dining-checks": "pages/dining-checks/dining-checks.html",
  "eighty-six-board": "pages/eighty-six-board/eighty-six-board.html",
  "kds-board": "pages/kds-board/kds-board.html",
  "delivery-hub": "pages/delivery-hub/delivery-hub.html",
  "menus-modifiers": "pages/menus-modifiers/menus-modifiers.html",
  "haccp-safety": "pages/haccp-safety/haccp-safety.html",
  "tip-pools-zread": "pages/tip-pools-zread/tip-pools-zread.html",
  "voids-speed-audit": "pages/voids-speed-audit/voids-speed-audit.html",
  "check-detail": "pages/check-detail/check-detail.html",
  "menu-detail": "pages/menu-detail/menu-detail.html",
  "menu-item-drawer": "pages/menu-item-drawer/menu-item-drawer.html",
  "safety-log-drawer": "pages/safety-log-drawer/safety-log-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
